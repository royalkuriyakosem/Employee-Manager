<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="public/assets/logo.png" alt="">
    </header>
    <main>
        <section class="content-wrapper">
            <aside>
                <div class="list-wrapper">
                    <div class="list-icon">
                        <img src="public/assets/list-logo.png" alt="">
                    </div>
                    <div class="list-name">
                        Employee List
                    </div>
                </div>
            </aside>
            <div class="create-employee">
                <div class="create-employee-heading">
                    <h3> Create Employee </h3> 
                </div>
                <div class="fields">
                    <form action="">
                        <div class="input-values">
                            <label for="Employee">Employee Name</label><br>
                            <input type="text" placeholder="Employee Name">
                        </div>
                        <div class="input-values">
                            <label for="Employee">Employee ID</label><br>
                            <input type="text" placeholder="Employee ID">
                        </div>
                        <div class="input-values">
                            <label for="Employee">Joining Date</label><br>
                            <input type="text" placeholder="Joining Date">
                        </div>
                        <div class="input-values">
                            <label for="Employee">Role</label><br>
                            <input type="dropdown" placeholder="Role">
                             <!-- <select name="Role" id="Role" >
                                <option value="Role" selected></option>
                             </select> -->
                        </div>
                        <div class="input-values">
                            <label for="Employee">Status</label><br>
                            <input type="dropdown" placeholder="Status">
                        </div>
                        <div class="input-values">
                            <label for="Employee">Experience</label><br>
                            <input type="text" placeholder="Experience">
                        </div>
                        <div class="address-wrapper">
                            <label for="Employee">Address</label><br>
                            <div class="address">
                                <input type="text" placeholder="Address" class="address-name">
                                <input type="text" placeholder="City" class="city">
                                <input type="text" placeholder="Country" class="country">
                                <input type="text" placeholder="Postal Code" class="postal-code">
                            </div>
                        </div>
                        <div class="input-values">
                            <label for="Employee">Employee Name</label><br>
                            <input type="text" placeholder="Employee Name">
                        </div>
                        
                    </form>
                    <div class="button-wrapper">
                        <button class="button-submit">Create</button>
                        <button class="button-cancel">Cancel</button>
                    </div>
                    
                </div>
                

            </div>
        </section>
    </main>
</body>
</html>
